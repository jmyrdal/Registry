name: Publish Benson Demand Lab
on:
  push:
    branches: [main]
    paths:
      - 'benson-demand-lab/**'
      - '.github/workflows/benson-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: benson-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: benson-demand-lab/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: benson-demand-lab
      - run: pnpm test
        working-directory: benson-demand-lab
      - run: pnpm run build
        working-directory: benson-demand-lab
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: benson-demand-lab/dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
